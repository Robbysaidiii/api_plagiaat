[phases.setup]
nixPackages = ["python311"]

[phases.install]
cmds = [
  "python -m venv /app/.venv",
  "source /app/.venv/bin/activate",
  "pip install --upgrade pip",
  "pip install -r railway-requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"